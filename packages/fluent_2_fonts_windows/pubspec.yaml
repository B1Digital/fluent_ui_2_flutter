name: fluent_2_fonts_windows
description: "Windows-only open-source Selawik font assets for Fluent 2."
version: 0.0.1
repository: https://github.com/B1Digital/fluent_ui_2_flutter
issue_tracker: https://github.com/B1Digital/fluent_ui_2_flutter/issues
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - path: lib/fonts/selawk.ttf
      platforms:
        - windows
    - path: lib/fonts/selawksb.ttf
      platforms:
        - windows
    - path: lib/fonts/selawkb.ttf
      platforms:
        - windows
