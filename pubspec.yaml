name: fluent_2
description: "Fluent 2 design system for Flutter — a Dart pub workspace."
publish_to: none

environment:
  sdk: ^3.12.2

# Native pub workspace does resolution; the `melos:` section below drives the
# scripts. Melos 7 dropped support for a separate melos.yaml — config lives here.
workspace:
  - packages/fluent_2_fonts
  - packages/fluent_2_fonts_android
  - packages/fluent_2_fonts_ios
  - packages/fluent_2_fonts_macos
  - packages/fluent_2_fonts_web
  - packages/fluent_2_fonts_windows
  - packages/fluent_2_core
  - packages/fluent_2_web
  - packages/fluent_2_mobile
  - packages/fluent_2_web/example

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^7.0.0

melos:
  scripts:
    analyze:
      run: dart analyze --fatal-infos
      exec:
        concurrency: 4
      description: Analyze every package.

    format:
      run: dart format --set-exit-if-changed .
      exec:
        concurrency: 4
      description: Verify formatting.

    test:
      run: flutter test
      exec:
        concurrency: 4
        failFast: false
      packageFilters:
        dirExists: test
      description: Run tests in every package that has them.

    gen-l10n:
      # Regenerates packages/fluent_2_web/lib/src/l10n/ from l10n/*.arb. The
      # output is checked in, so this is only run when a message changes.
      # `expand_l10n_locales.dart` fans the 36 translated files out over the 135
      # supported locales; `strip_l10n_material.dart` removes the
      # flutter_localizations coupling gen_l10n emits unconditionally — see
      # `no-material` below. gen_l10n writes to .dart_tool/ and only this script
      # copies into lib/, so a plain `flutter pub get` cannot put the Material
      # import back into the checked-in files.
      run: |
        set -e
        dart tool/expand_l10n_locales.dart
        (cd packages/fluent_2_web && flutter gen-l10n)
        out=packages/fluent_2_web/.dart_tool/fluent_l10n
        dart tool/strip_l10n_material.dart $out/fluent_localizations.dart
        rm -f packages/fluent_2_web/lib/src/l10n/fluent_localizations*.dart
        cp $out/*.dart packages/fluent_2_web/lib/src/l10n/
        dart format packages/fluent_2_web/lib/src/l10n
      description: Regenerate the Fluent localizations from the ARB files.

    no-material:
      # The whole point of the design system: nothing may depend on Material.
      # Anchored to real import/export directives so doc comments mentioning
      # Material don't trip it.
      run: |
        if grep -rnE "^\s*(import|export) 'package:flutter/(material|cupertino)\.dart'" packages/*/lib packages/*/test; then
          echo "ERROR: Material/Cupertino import found — fluent_2 replaces them."
          exit 1
        fi
        # flutter_localizations re-exports GlobalMaterialLocalizations, so it
        # pulls Material in without naming it. `flutter gen-l10n` emits that
        # import every time; `melos run gen-l10n` strips it back out.
        if grep -rnE "^\s*(import|export) 'package:flutter_localizations/" packages/*/lib packages/*/test; then
          echo "ERROR: flutter_localizations import found — it re-exports Material."
          echo "Run 'melos run gen-l10n' to regenerate without it."
          exit 1
        fi
        echo "OK: no Material or Cupertino imports."
      description: Fail if any package imports Material.

    chart-invariants:
      # Two single-owner rules the charts subsystem depends on. Both held
      # through four waves on discipline alone; with the bulk of the port still
      # to come, they are enforced here instead. Anchored the same way
      # `no-material` is, so a doc comment mentioning a name cannot trip them.
      run: |
        painters=$(grep -rn 'TextPainter(' packages/fluent_2_web/lib/src/charts | wc -l | tr -d ' ')
        if [ "$painters" != "1" ]; then
          echo "ERROR: expected exactly ONE TextPainter( under lib/src/charts — the"
          echo "FluentChartTextMeasurer.layoutPainter factory. A painter that builds its own"
          echo "drifts from the configuration its metrics were measured with, and paints at a"
          echo "width the margin solver never reserved. Found $painters:"
          grep -rn 'TextPainter(' packages/fluent_2_web/lib/src/charts
          exit 1
        fi
        casers=$(grep -rnE '^\s*String capitalizeLegendLabel' packages/fluent_2_web/lib | wc -l | tr -d ' ')
        if [ "$casers" != "1" ]; then
          echo "ERROR: expected exactly ONE capitalizeLegendLabel declaration. Flutter has no"
          echo "text-transform, so labels are title-cased in Dart before painting AND before"
          echo "measuring; a second copy makes those two disagree. Found $casers:"
          grep -rnE '^\s*String capitalizeLegendLabel' packages/fluent_2_web/lib
          exit 1
        fi
        measurers=$(grep -rnE '^\s*class FluentChartTextMeasurer' packages/fluent_2_web/lib | wc -l | tr -d ' ')
        if [ "$measurers" != "1" ]; then
          echo "ERROR: expected exactly ONE FluentChartTextMeasurer. Found $measurers:"
          grep -rnE '^\s*class FluentChartTextMeasurer' packages/fluent_2_web/lib
          exit 1
        fi
        echo "OK: chart invariants hold (1 TextPainter factory, 1 capitalizeLegendLabel, 1 measurer)."
      description: Fail if a charts single-owner invariant is broken.

    ci:
      run: melos run analyze && melos run format && melos run no-material && melos run chart-invariants && melos run test
      description: Everything CI runs.
